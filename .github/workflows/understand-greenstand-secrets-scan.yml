name: "Understand Greenstand: Secrets scan"

# Scans for leaked secrets with two independent engines, gitleaks and betterleaks.
# Both read the shared .gitleaks.toml and .gitleaksignore. The scanner CLIs run directly
# (MIT): gitleaks-action needs a paid license key for organization repos.
# A finding fails the job. Reports are always --redact, so logs and summaries hold no secret.
# The private-names job also checks commit messages, the branch name, and pull request text
# for private Greenstand repo names, which neither scanner reads in git mode. It also checks
# the safety review of the shared-resource page and the capture journey (check-safety-review.mjs).
# understand-greenstand-secrets-scan-issues.yml scans issues, pull requests, and comments.

on:
  push:
    paths:
      - "understand-greenstand/**"
      - ".github/workflows/understand-greenstand-*.yml"
      - ".github/ISSUE_TEMPLATE/understand-greenstand-*.yml"
  pull_request:
    paths:
      - "understand-greenstand/**"
      - ".github/workflows/understand-greenstand-*.yml"
      - ".github/ISSUE_TEMPLATE/understand-greenstand-*.yml"
    # "edited": a changed pull request title or body is checked again.
    types: [opened, edited, synchronize, reopened]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Our files live in the folder understand-greenstand/ of this repo: each run step starts there.
defaults:
  run:
    working-directory: understand-greenstand

concurrency:
  group: understand-greenstand-secrets-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-history:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tool: [gitleaks, betterleaks]
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load scanner pins
        run: grep -E '^[A-Z0-9_]+=' .github/scanner-versions.env >> "$GITHUB_ENV"

      - name: Install ${{ matrix.tool }}
        run: |
          if [ "${{ matrix.tool }}" = gitleaks ]; then
            .github/scripts/install-scanner.sh gitleaks "$GITLEAKS_VERSION" "$GITLEAKS_SHA256"
          else
            .github/scripts/install-scanner.sh betterleaks "$BETTERLEAKS_VERSION" "$BETTERLEAKS_SHA256"
          fi

      - name: Build scan config
        env:
          PRIVATE_REPO_NAMES: ${{ secrets.PRIVATE_REPO_NAMES }}
          # Fake terms for end-to-end tests only; normally unset.
          PRIVATE_NAMES_EXTRA_TERMS: ${{ vars.PRIVATE_NAMES_EXTRA_TERMS }}
        run: |
          .github/scripts/private-names.sh config "$RUNNER_TEMP/scan.toml"
          echo "SCAN_CONFIG=$RUNNER_TEMP/scan.toml" >> "$GITHUB_ENV"

      # Only the history of our files: understand-greenstand/ (the cwd) and our files in .github/.
      # A bare scan would read the whole history of this repo, which is not ours to fix.
      - name: Scan git history
        run: >-
          ${{ matrix.tool }} git . --log-opts="--full-history --all -- . :(top,glob).github/workflows/understand-greenstand-*.yml :(top,glob).github/ISSUE_TEMPLATE/understand-greenstand-*.yml"
          --gitleaks-ignore-path .gitleaksignore --config "$SCAN_CONFIG" --redact --no-banner
          --report-format json --report-path "$RUNNER_TEMP/findings.json"

      - name: Summarize findings
        if: always()
        run: .github/scripts/scan-summary.sh "${{ matrix.tool }} (git history)" "$RUNNER_TEMP/findings.json"

      - name: Write SARIF report
        if: always()
        run: >-
          ${{ matrix.tool }} git . --log-opts="--full-history --all -- . :(top,glob).github/workflows/understand-greenstand-*.yml :(top,glob).github/ISSUE_TEMPLATE/understand-greenstand-*.yml"
          --gitleaks-ignore-path .gitleaksignore --config "$SCAN_CONFIG" --redact --no-banner --exit-code 0
          --report-format sarif --report-path "$RUNNER_TEMP/findings.sarif"

      # Fork pull requests get a read-only token and cannot upload.
      - name: Upload SARIF to code scanning
        if: always() && !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/findings.sarif
          category: understand-greenstand-${{ matrix.tool }}

  private-names:
    name: private-names
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PRIVATE_REPO_NAMES: ${{ secrets.PRIVATE_REPO_NAMES }}
      # Fake terms for end-to-end tests only; normally unset.
      PRIVATE_NAMES_EXTRA_TERMS: ${{ vars.PRIVATE_NAMES_EXTRA_TERMS }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load scanner pins
        run: grep -E '^[A-Z0-9_]+=' .github/scanner-versions.env >> "$GITHUB_ENV"

      - name: Install scanners
        run: |
          .github/scripts/install-scanner.sh gitleaks "$GITLEAKS_VERSION" "$GITLEAKS_SHA256"
          .github/scripts/install-scanner.sh betterleaks "$BETTERLEAKS_VERSION" "$BETTERLEAKS_SHA256"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Secrets are not available to pull requests from forks.
      - name: Check that the CI name list is current
        run: |
          if [ -z "$PRIVATE_REPO_NAMES" ]; then
            echo "::warning::PRIVATE_REPO_NAMES is not set; skipping the fingerprint check."
          else
            .github/scripts/private-names.sh fingerprint-check
          fi

      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) range=("$BASE_SHA..HEAD") ;;
            push)
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                range=("origin/$DEFAULT_BRANCH..HEAD")
              else
                range=("$BEFORE..HEAD")
              fi ;;
            *) range=(HEAD) ;;  # schedule and manual runs: the full history
          esac
          # Only the commits that change our files (the same paths as the scan of the history).
          .github/scripts/private-names.sh messages "${range[@]}" -- . \
            ':(top,glob).github/workflows/understand-greenstand-*.yml' \
            ':(top,glob).github/ISSUE_TEMPLATE/understand-greenstand-*.yml'

      # Read event text from $GITHUB_EVENT_PATH and default variables, not from a step env:
      # block, because GitHub prints step env values in the public log. Never use ${{ }} for
      # event text in a script either.
      - name: Check the branch name and pull request text
        if: always()
        run: |
          rc=0
          printf '%s\n' "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            | .github/scripts/private-names.sh text "the branch name" || rc=1
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH" \
              | .github/scripts/private-names.sh text "the pull request title" || rc=1
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" \
              | .github/scripts/private-names.sh text "the pull request body" || rc=1
          fi
          exit "$rc"

      # A pull request that changes a file of a page in PAGES of check-safety-review.mjs (the
      # shared-resource page, the capture journey) needs the "Safety review:" line and the ticked
      # template item of each page that it changes. The "edited" event runs it again, so a tick at
      # the merge turns it green.
      - name: Check the safety review of the shared-resource page and the capture journey
        if: always()
        run: node .github/scripts/check-safety-review.mjs
