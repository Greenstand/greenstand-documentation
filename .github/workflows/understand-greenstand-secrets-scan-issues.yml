name: "Understand Greenstand: Secrets scan (issues)"

# Scans issues, pull requests, and their comments for leaked secrets with betterleaks.
# gitleaks has no GitHub API source, so only betterleaks runs here. It uses the same shared
# name list (the PRIVATE_REPO_NAMES secret) as understand-greenstand-secrets-scan.yml. A new finding fails the job.
# The scan reads all issues and pull requests of this repo, also the text of other Greenstand teams,
# which we do not edit. A finding in such text that a person judged and left in place is a known finding: its key is
# in the ISSUE_SCAN_KNOWN secret, and the gate (issue-scan-gate.mjs) allows it. The log and the
# summary give only the count of known findings.
# Reports are always --redact, so logs and summaries hold no secret.
# Issue events run this file from the default branch only. The scan reads issue text as
# data; never interpolate issue fields into a run step.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # Hourly: text typed on github.com cannot be checked before it is published, so this bounds
  # how long a leak goes unseen. A failed scheduled run notifies the user who last changed it.
  # GitHub can delay or skip a scheduled run: on 2026-10-15 the runs came 3 to 5 hours apart.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Our files live in the folder understand-greenstand/ of this repo: each run step starts there.
defaults:
  run:
    working-directory: understand-greenstand

concurrency:
  group: understand-greenstand-secrets-scan-issues
  cancel-in-progress: true

jobs:
  issues:
    name: betterleaks-issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout (config only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Load scanner pins
        run: grep -E '^[A-Z0-9_]+=' .github/scanner-versions.env >> "$GITHUB_ENV"

      - name: Install betterleaks
        run: .github/scripts/install-scanner.sh betterleaks "$BETTERLEAKS_VERSION" "$BETTERLEAKS_SHA256"

      - name: Build scan config
        env:
          PRIVATE_REPO_NAMES: ${{ secrets.PRIVATE_REPO_NAMES }}
          # Fake terms for end-to-end tests only; normally unset.
          PRIVATE_NAMES_EXTRA_TERMS: ${{ vars.PRIVATE_NAMES_EXTRA_TERMS }}
        run: |
          .github/scripts/private-names.sh config "$RUNNER_TEMP/scan.toml"
          echo "SCAN_CONFIG=$RUNNER_TEMP/scan.toml" >> "$GITHUB_ENV"

      - name: Scan issues, pull requests, and comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          betterleaks github "https://github.com/${{ github.repository }}"
          --include issues,issue-comments,prs,pr-comments --exclude repos
          --config "$SCAN_CONFIG" --redact --no-banner --exit-code 0
          --report-format json --report-path "$RUNNER_TEMP/findings.json"

      # Fails on a new finding. The known findings (the ISSUE_SCAN_KNOWN secret) pass.
      - name: Allow the known findings
        env:
          ISSUE_SCAN_KNOWN: ${{ secrets.ISSUE_SCAN_KNOWN }}
        run: node .github/scripts/issue-scan-gate.mjs "$RUNNER_TEMP/findings.json" "$RUNNER_TEMP/new-findings.json"

      - name: Summarize findings
        if: always()
        run: >-
          .github/scripts/scan-summary.sh "betterleaks (issues and pull requests)"
          "$RUNNER_TEMP/new-findings.json" "$RUNNER_TEMP/findings.json"
