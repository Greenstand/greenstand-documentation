<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="t">
<title id="t">The export, with made-up data. The Captures page lists 3 captures, approved or not approved yet, and has the button Export Captures. In the dialog, the person picks the columns, for example the capture number, the verification status, and the species. The admin panel then downloads a spreadsheet file with one row for each capture, up to 20,000 captures</title>
