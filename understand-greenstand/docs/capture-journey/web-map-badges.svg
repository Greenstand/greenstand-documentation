<path class="line" d="M180 176v13"/><path d="M173 188l7 9 7-9z" fill="#8c959f"/>
<g><rect class="card" x="16" y="204" width="328" height="156" rx="10"/><rect class="gl" x="28" y="216" width="304" height="72" rx="6"/>
<rect class="trunk" x="177" y="258" width="6" height="24"/><circle class="tree1" cx="180" cy="248" r="22"/>
<rect class="gl" x="28" y="298" width="304" height="30" rx="15" stroke="#4c9a2a" stroke-width="1.5"/><text x="180" y="318" text-anchor="middle" style="font:600 14px system-ui,sans-serif;fill:#1a7f37">Verified</text>
<text class="s" x="180" y="350" text-anchor="middle">After the approval</text></g>
